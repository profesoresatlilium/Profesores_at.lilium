<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profesores_at.lilium — Clases particulares de inglés</title>
<meta name="description" content="Organización de profesores de inglés dedicada a clases particulares, con historia, visión y misión propias.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="encabezado">
  <nav class="nav contenedor">
    <a href="index.html" class="marca">
      <div class="logo-hueco" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 44 L24 28"/>
          <path d="M24 38 C20 38 17 35 16 32"/>
          <path d="M24 28 C24 20 20 12 24 4 C28 12 24 20 24 28 Z"/>
          <path d="M24 28 C30 22 38 18 44 20 C38 24 30 26 24 28 Z"/>
          <path d="M24 28 C18 22 10 18 4 20 C10 24 18 26 24 28 Z"/>
          <path d="M24 28 C29 21 34 13 32 6 C27 11 25 20 24 28 Z"/>
          <path d="M24 28 C19 21 14 13 16 6 C21 11 23 20 24 28 Z"/>
          <circle cx="24" cy="27" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="marca-nombre">
        <span data-bind="sitio.nombre"></span>
        <span data-bind="sitio.tagline"></span>
      </div>
    </a>
    <button class="nav-toggle" aria-label="Abrir menú"><span></span></button>
    <ul class="nav-links" data-nav></ul>
  </nav>
</header>

<main>

  <!-- HERO -->
  <section class="hero">
    <div class="contenedor hero-grid">
      <div>
        <h1 data-bind-html="inicio.heroTituloHtml"></h1>
        <p class="lead" data-bind="inicio.heroLead"></p>
        <div class="hero-acciones">
          <a href="horarios.html" class="boton boton-primario">Ver horarios y precios</a>
          <a href="profesores.html" class="boton boton-secundario">Conocer a los profesores</a>
        </div>
      </div>

      <div class="prueba" id="prueba-lista" aria-hidden="true"></div>
    </div>
  </section>

  <!-- QUIÉNES SOMOS -->
  <section class="seccion papel-lineas">
    <div class="contenedor">
      <div class="seccion-cabecera reveal">
        <h2 data-bind="inicio.quienesSomosTitulo"></h2>
      </div>
      <div class="dos-columnas reveal">
        <div class="parrafo-grande editar">
          <p data-bind="inicio.quienesSomosParrafo1"></p>
          <p data-bind="inicio.quienesSomosParrafo2"></p>
        </div>
        <div class="parrafo-grande editar">
          <p><em data-bind="inicio.historiaTexto"></em></p>
        </div>
      </div>
    </div>
  </section>

  <!-- VISIÓN Y MISIÓN -->
  <section class="seccion">
    <div class="contenedor">
      <div class="seccion-cabecera reveal">
        <h2>Visión y misión</h2>
      </div>
      <div class="dos-columnas reveal">
        <div class="tarjeta editar">
          <span class="marca-tab">Misión</span>
          <h3 data-bind="inicio.mision.titulo"></h3>
          <p data-bind="inicio.mision.texto"></p>
        </div>
        <div class="tarjeta editar">
          <span class="marca-tab">Visión</span>
          <h3 data-bind="inicio.vision.titulo"></h3>
          <p data-bind="inicio.vision.texto"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="seccion" style="padding-top:0;">
    <div class="contenedor">
      <div class="cta-final reveal">
        <div>
          <h2 data-bind="inicio.ctaTitulo"></h2>
          <p data-bind="inicio.ctaTexto"></p>
        </div>
        <div class="hero-acciones">
          <a href="horarios.html" class="boton boton-primario">Ver horarios y precios</a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="pie">
  <div class="contenedor">
    <div class="pie-grid">
      <span class="pie-marca" data-bind="sitio.nombre"></span>
      <ul class="pie-links" data-nav></ul>
    </div>
    <p class="pie-copy">© <span data-bind="sitio.anioCopyright"></span> <span data-bind="sitio.nombre"></span> — Organización de profesores de inglés.</p>
  </div>
</footer>

<script src="contenido.js"></script>
<script src="render.js"></script>
<script src="script.js"></script>
</body>
</html>

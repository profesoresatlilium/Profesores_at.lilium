<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios y precios — Profesores_at.lilium</title>
<meta name="description" content="Horarios disponibles para clases particulares de inglés y precios de cada pack de clases.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="encabezado">
  <nav class="nav contenedor">
    <a href="index.html" class="marca">
      <div class="logo-hueco" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 44 L24 28"/>
          <path d="M24 38 C20 38 17 35 16 32"/>
          <path d="M24 28 C24 20 20 12 24 4 C28 12 24 20 24 28 Z"/>
          <path d="M24 28 C30 22 38 18 44 20 C38 24 30 26 24 28 Z"/>
          <path d="M24 28 C18 22 10 18 4 20 C10 24 18 26 24 28 Z"/>
          <path d="M24 28 C29 21 34 13 32 6 C27 11 25 20 24 28 Z"/>
          <path d="M24 28 C19 21 14 13 16 6 C21 11 23 20 24 28 Z"/>
          <circle cx="24" cy="27" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="marca-nombre">
        <span data-bind="sitio.nombre"></span>
        <span data-bind="sitio.tagline"></span>
      </div>
    </a>
    <button class="nav-toggle" aria-label="Abrir menú"><span></span></button>
    <ul class="nav-links" data-nav></ul>
  </nav>
</header>

<main>

  <section class="hero" style="padding: 60px 0 72px;">
    <div class="contenedor">
      <h1 style="max-width: 20ch;" data-bind-html="horarios.heroTituloHtml"></h1>
      <p class="lead" data-bind="horarios.heroLead"></p>
    </div>
  </section>

  <!-- HORARIOS -->
  <section class="seccion papel-lineas">
    <div class="contenedor">
      <div class="seccion-cabecera reveal">
        <h2 data-bind="horarios.horarioIntroTitulo"></h2>
        <p data-bind="horarios.horarioIntroTexto"></p>
      </div>

      <div class="reveal editar" style="overflow-x:auto; border:1px solid var(--papel-linea); border-radius: 10px; background: var(--papel);">
        <table style="width:100%; border-collapse: collapse; min-width: 360px;">
          <thead>
            <tr style="background:#F3EAF1;">
              <th style="text-align:left; padding:14px 18px; font-family: var(--fuente-nota); font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--tinta-suave);">Día</th>
              <th style="text-align:left; padding:14px 18px; font-family: var(--fuente-nota); font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--tinta-suave);">Horario</th>
            </tr>
          </thead>
          <tbody id="tabla-horarios-cuerpo"></tbody>
        </table>
      </div>
      <p style="margin-top:14px; font-size:0.85rem; color:var(--tinta-suave);" data-bind="horarios.horarioNota"></p>
    </div>
  </section>

  <!-- PRECIOS -->
  <section class="seccion" style="padding-top:0;">
    <div class="contenedor">
      <div class="seccion-cabecera reveal">
        <h2 data-bind="horarios.precioIntroTitulo"></h2>
        <p data-bind="horarios.precioIntroTexto"></p>
      </div>

      <div class="dos-columnas reveal" id="packs-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));"></div>
      <p style="margin-top:22px; font-size:0.92rem; color:var(--tinta-suave);" data-bind="horarios.packsNota"></p>
    </div>
  </section>

  <section class="seccion" style="padding-top:0;">
    <div class="contenedor">
      <div class="cta-final reveal">
        <div>
          <h2 data-bind="horarios.ctaTitulo"></h2>
          <p data-bind="horarios.ctaTexto"></p>
        </div>
        <a href="profesores.html#contacto" class="boton boton-primario">Ir a contacto</a>
      </div>
    </div>
  </section>

</main>

<footer class="pie">
  <div class="contenedor">
    <div class="pie-grid">
      <span class="pie-marca" data-bind="sitio.nombre"></span>
      <ul class="pie-links" data-nav></ul>
    </div>
    <p class="pie-copy">© <span data-bind="sitio.anioCopyright"></span> <span data-bind="sitio.nombre"></span> — Organización de profesores de inglés.</p>
  </div>
</footer>

<script src="contenido.js"></script>
<script src="render.js"></script>
<script src="script.js"></script>
</body>
</html>

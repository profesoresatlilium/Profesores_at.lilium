<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profesores y contacto — Profesores_at.lilium</title>
<meta name="description" content="Conoce a los profesores de inglés de la organización y encuentra nuestros datos de contacto.">
<link rel="stylesheet" href="style.css">
<style>
  .profesores-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 26px;
  }
  .profe-card{
    background: var(--papel);
    border: 1px solid var(--papel-linea);
    border-radius: 10px;
    overflow:hidden;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .profe-card:hover{ transform: translateY(-4px); box-shadow: var(--sombra); }
  .profe-foto{
    aspect-ratio: 4/5;
    background: var(--tiza);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--fuente-display);
    font-size: 2.4rem;
    color: var(--tinta-suave);
    border-bottom: 1px solid var(--papel-linea);
  }
  .profe-info{ padding: 18px 20px 22px; }
  .profe-info .marca-tab{
    font-family: var(--fuente-nota);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform:uppercase;
    color: var(--rojo-correccion);
    display:block;
    margin-bottom: 6px;
  }
  .profe-info h3{
    font-family: var(--fuente-display);
    font-size: 1.2rem;
    margin: 0 0 8px;
  }
  .profe-info p{
    margin:0;
    color: var(--tinta-suave);
    font-size: 0.92rem;
  }

  .contacto-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 22px;
  }
  .contacto-item{
    background: var(--pizarron);
    color: var(--tiza);
    border-radius: 10px;
    padding: 26px 24px;
    display:flex;
    gap: 16px;
    align-items:flex-start;
  }
  .contacto-icono{
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(250,249,243,0.1);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .contacto-item h3{
    font-family: var(--fuente-nota);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform:uppercase;
    margin: 4px 0 6px;
    color: var(--amarillo-marcador);
  }
  .contacto-item a, .contacto-item p{
    margin:0;
    color: var(--tiza);
    text-decoration:none;
    font-size: 1rem;
    word-break: break-word;
  }
</style>
</head>
<body>

<header class="encabezado">
  <nav class="nav contenedor">
    <a href="index.html" class="marca">
      <div class="logo-hueco" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 44 L24 28"/>
          <path d="M24 38 C20 38 17 35 16 32"/>
          <path d="M24 28 C24 20 20 12 24 4 C28 12 24 20 24 28 Z"/>
          <path d="M24 28 C30 22 38 18 44 20 C38 24 30 26 24 28 Z"/>
          <path d="M24 28 C18 22 10 18 4 20 C10 24 18 26 24 28 Z"/>
          <path d="M24 28 C29 21 34 13 32 6 C27 11 25 20 24 28 Z"/>
          <path d="M24 28 C19 21 14 13 16 6 C21 11 23 20 24 28 Z"/>
          <circle cx="24" cy="27" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="marca-nombre">
        <span data-bind="sitio.nombre"></span>
        <span data-bind="sitio.tagline"></span>
      </div>
    </a>
    <button class="nav-toggle" aria-label="Abrir menú"><span></span></button>
    <ul class="nav-links" data-nav></ul>
  </nav>
</header>

<main>

  <section class="hero" style="padding: 60px 0 72px;">
    <div class="contenedor">
      <span class="eyebrow">El equipo</span>
      <h1 style="max-width: 22ch;" data-bind-html="profesores.heroTituloHtml"></h1>
      <p class="lead" data-bind="profesores.heroLead"></p>
    </div>
  </section>

  <!-- PROFESORES -->
  <section class="seccion papel-lineas">
    <div class="contenedor">
      <div class="seccion-cabecera reveal">
        <span class="eyebrow">Presentaciones</span>
        <h2 data-bind="profesores.listaTitulo"></h2>
        <p data-bind="profesores.listaTexto"></p>
      </div>

      <div class="profesores-grid reveal editar" id="profesores-grid"></div>
    </div>
  </section>

  <!-- CONTACTO -->
  <section id="contacto" class="seccion" style="padding-top:0;">
    <div class="contenedor">
      <div class="seccion-cabecera reveal">
        <span class="eyebrow">Hablemos</span>
        <h2 data-bind="profesores.contactoTitulo"></h2>
        <p data-bind="profesores.contactoTexto"></p>
      </div>

      <div class="contacto-grid reveal editar">
        <div class="contacto-item">
          <div class="contacto-icono">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </div>
          <div>
            <h3>Teléfono</h3>
            <a data-bind="sitio.telefonoTexto" id="link-telefono"></a>
          </div>
        </div>

        <div class="contacto-item">
          <div class="contacto-icono">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"></path><path d="M22 6l-10 7L2 6"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
          </div>
          <div>
            <h3>Correo</h3>
            <a data-bind="sitio.correo" id="link-correo"></a>
          </div>
        </div>

        <div class="contacto-item">
          <div class="contacto-icono">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"></circle></svg>
          </div>
          <div>
            <h3>Instagram</h3>
            <a data-bind="sitio.instagramTexto" data-bind-href="sitio.instagramUrl" target="_blank" rel="noopener"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="pie">
  <div class="contenedor">
    <div class="pie-grid">
      <span class="pie-marca" data-bind="sitio.nombre"></span>
      <ul class="pie-links" data-nav></ul>
    </div>
    <p class="pie-copy">© <span data-bind="sitio.anioCopyright"></span> <span data-bind="sitio.nombre"></span> — Organización de profesores de inglés.</p>
  </div>
</footer>

<script src="contenido.js"></script>
<script src="render.js"></script>
<script src="script.js"></script>
</body>
</html>
